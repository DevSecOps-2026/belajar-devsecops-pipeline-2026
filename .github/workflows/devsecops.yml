name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  # ==========================================
  # CI JOB 1: SAST Scan (Semgrep)
  # ==========================================
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error --verbose --exclude=".github"

  # ==========================================
  # CI JOB 2: Code Quality (Pylint)
  # ==========================================
  pylint-check:
    name: Pylint Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt
      - name: Run Pylint Check
        run: pylint --fail-under=9.0 app.py

  # ==========================================
  # CI JOB 3: Dependency Security (pip-audit)
  # Posisi: Setelah Pylint Check
  # ==========================================
  dependency-security:
    name: Dependency Security Scan
    needs: pylint-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run Dependency Scan
        run: pip-audit -r requirements.txt

  # ==========================================
  # CD STAGE: Build, Container Scan, & Deploy ke VM
  # ==========================================
  deploy-to-vm:
    name: Build, Scan & Deploy to Target VM
    needs: [sast-scan, dependency-security]
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t secure-flask-app:latest .

      # Posisi: Container Security (Setelah Docker Build & Sebelum Deploy)
      - name: Container Security Scan (Trivy)
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 secure-flask-app:latest

      - name: Deploy Container
        run: |
          docker stop web-flask || true
          docker rm web-flask || true
          docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
          docker ps | grep web-flask
