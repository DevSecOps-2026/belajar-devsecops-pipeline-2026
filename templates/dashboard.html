<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 3rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 600px; width: 90%; }
        h1 { color: #333; margin-top: 0; }
        p { color: #666; margin-bottom: 2rem; font-size: 1.1rem; }
        .btn-logout { padding: 0.75rem 1.5rem; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; transition: background-color 0.2s;}
        .btn-logout:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Selamat Datang di Dashboard! 🚀</h1>
        <p>Anda telah berhasil masuk ke dalam sistem yang aman.</p>
        
        <!-- Tombol ini mengarah kembali ke route utama (login) untuk simulasi logout -->
        <a href="/" class="btn-logout">Logout</a>
    </div>

</body>
</html>
