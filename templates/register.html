<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Pengguna</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold;}
        button:hover { background-color: #218838; }
        
        /* Styling untuk notifikasi */
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center; font-size: 0.9rem; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        
        .link { display: block; text-align: center; margin-top: 1rem; color: #007bff; text-decoration: none; font-size: 0.9rem;}
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Buat Akun Baru</h2>
        
        <!-- Menampilkan pesan jika ada -->
        {% if message %}
            <div class="alert {{ status_class }}">
                {{ message }}
            </div>
        {% endif %}

        <!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -->
        <form action="/register" method="POST">
            <div class="form-group">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>
            <button type="submit">Daftar Sekarang</button>
        </form>
        <a href="/" class="link">Kembali ke halaman Login</a>
    </div>

</body>
</html>
